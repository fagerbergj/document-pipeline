services:
  pipeline:
    build: .
    container_name: document-pipeline
    ports:
      - "8000:8000"
    # Production env is sourced from ~/workspace/home-server/.env via the
    # home-server/api/docker-compose.yml stack. This file is for standalone
    # local dev only — env vars below all have safe defaults, override via
    # shell env (export FOO=bar) or `docker compose run -e FOO=bar` if needed.
    environment:
      - DB_PATH=/data/pipeline.db
      - MIGRATIONS_DIR=/db/migrations
      - VAULT_PATH=/vault
      - PIPELINE_CONFIG=/config/pipeline.yaml
      - LISTEN_ADDR=:8000
      - LLM_URL=${LLM_URL:-http://llm-swap:11436}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - WHISPER_URL=${WHISPER_URL:-http://faster-whisper:8000}
      - WHISPER_MODEL=${WHISPER_MODEL:-Systran/faster-whisper-large-v3}
      # Per-stage model names — values resolved by llm-swap at request time.
      # Fill these in from your llm-swap.yaml model keys.
      - OCR_MODEL=${OCR_MODEL:-}
      - CLARIFY_MODEL=${CLARIFY_MODEL:-}
      - CHAT_MODEL=${CHAT_MODEL:-}
      - CLASSIFY_MODEL=${CLASSIFY_MODEL:-}
      - SUMMARIZE_MODEL=${SUMMARIZE_MODEL:-}
      - CONTEXTUAL_MODEL=${CONTEXTUAL_MODEL:-}
      - EMBED_MODEL=${EMBED_MODEL:-}
      - QDRANT_URL=${QDRANT_URL:-}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-documents}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - PIPELINE_SYSTEM_USER_ID=4fc55e8a27ebf91f9650c48a59468793350b8d49b4777021966e2eb2d2b0dfb5
    volumes:
      - ./data:/data
      - /mnt/personal/documents:/vault
    networks:
      - default
      - api_gateway
      - api_default
      - llm_default
      - audio_default
    restart: unless-stopped

networks:
  api_gateway:
    external: true
    name: api_gateway
  api_default:
    external: true
    name: api_default
  llm_default:
    external: true
    name: llm_default
  audio_default:
    external: true
    name: audio_default
